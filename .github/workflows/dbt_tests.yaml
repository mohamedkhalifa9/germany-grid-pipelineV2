name: dbt tests

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: pip install dbt-duckdb

      - name: Create dbt profile
        working-directory: energy_dbt
        run: |
          cat > profiles.yml << 'EOF'
          energy_dbt:
            target: dev
            outputs:
              dev:
                type: duckdb
                path: ci.duckdb
          EOF

      - name: Compile dbt project
        working-directory: energy_dbt
        run: dbt compile --profiles-dir .
